name: Deploy Hugo site

on:
  schedule:
    - cron: '17 9 * * 1'   # weekly refresh of the receipts ledger
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d # v2
        with:
          hugo-version: 'latest'

      - name: Collect receipts from public repos
        run: |
          mkdir -p _repos data
          for r in FlowState order-book-engine distributed-gpu-training-flight-recorder tokenomics-bench measured-speedup-harness; do
            git clone --quiet --depth 1 "https://github.com/RyanJHamby/$r" "_repos/$r"
          done
          python3 tools/collect_claims.py --verified-only data/claims.json .=RyanJHamby/RyanJHamby.github.io \
            $(for d in _repos/*; do echo "$d=RyanJHamby/$(basename "$d")"; done)
          cp data/claims.json static/claims.json

      - name: Build
        run: hugo

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
